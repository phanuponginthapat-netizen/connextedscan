<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>FaceGate</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Sarabun", "Prompt", "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(1200px 700px at 50% -10%, #1e3a5f 0%, #0f1e33 50%, #0a1424 100%);
        color: #e8eef6;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 26px;
        -webkit-user-select: none;
        user-select: none;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes floaty { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }
      @keyframes sheen { 0% { background-position: -160% 0; } 100% { background-position: 260% 0; } }
      body > * { animation: rise 0.6s cubic-bezier(0.22,1,0.36,1) both; }
      body > *:nth-child(2) { animation-delay: 0.08s; }
      body > *:nth-child(3) { animation-delay: 0.16s; }
      body > *:nth-child(4) { animation-delay: 0.24s; }
      body > *:nth-child(5) { animation-delay: 0.32s; }
      body::after {
        content: "";
        position: fixed; left: 0; right: 0; bottom: 0; height: 3px;
        background: linear-gradient(90deg, transparent, #3b82f6, transparent);
        background-size: 200% 100%;
        animation: sheen 1.9s linear infinite;
      }
      .logo {
        width: 96px; height: 96px;
        border-radius: 26px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        display: flex; align-items: center; justify-content: center;
        font-size: 46px;
        box-shadow: 0 16px 48px rgba(37, 99, 235, 0.45);
        animation: pulse 2.2s ease-in-out infinite, floaty 4.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 16px 48px rgba(37, 99, 235, 0.45); }
        50% { box-shadow: 0 16px 64px rgba(37, 99, 235, 0.7); }
      }
      h1 { margin: 0; font-size: 34px; letter-spacing: 0.5px; background: linear-gradient(100deg,#e8eef6,#7cb0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .sub { color: #8ba3c4; font-size: 15px; margin-top: -14px; }
      .spinner {
        width: 44px; height: 44px;
        border: 4px solid rgba(148, 163, 184, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #msg { color: #b7c9e2; font-size: 15px; min-height: 22px; transition: color 0.3s ease; }
      .warn { color: #fbbf24 !important; }
    </style>
  </head>
  <body>
    <div class="logo">🛡️</div>
    <h1>FaceGate</h1>
    <div class="sub">ระบบสแกนใบหน้าเข้า–ออกโรงเรียน</div>
    <div class="spinner" id="spinner"></div>
    <div id="msg">กำลังเปิดระบบ…</div>
    <script>
      let seconds = 0;
      const msg = document.getElementById("msg");
      const spinner = document.getElementById("spinner");
      setInterval(() => {
        seconds += 1;
        if (seconds === 8) {
          msg.textContent = "กำลังรอการเชื่อมต่ออินเทอร์เน็ต…";
        } else if (seconds === 20) {
          msg.textContent = "ยังเชื่อมต่อไม่ได้ — ตรวจสอบสายแลน / Wi-Fi ของเครื่องตู้";
          msg.className = "warn";
        } else if (seconds > 20 && seconds % 10 === 0) {
          msg.textContent = "ยังเชื่อมต่อไม่ได้ — ระบบจะลองใหม่เรื่อย ๆ อัตโนมัติ (" + seconds + " วินาที)";
        }
      }, 1000);
      window.addEventListener("offline", () => {
        msg.textContent = "ไม่มีอินเทอร์เน็ต — รอการเชื่อมต่อ";
        msg.className = "warn";
      });
    </script>
  </body>
</html>
