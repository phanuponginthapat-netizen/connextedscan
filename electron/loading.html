<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>FaceGate</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Sarabun", "Prompt", "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(1200px 700px at 50% -10%, #1e3a5f 0%, #0f1e33 50%, #0a1424 100%);
        color: #e8eef6;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 26px;
        -webkit-user-select: none;
        user-select: none;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes floaty { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }
      @keyframes sheen { 0% { background-position: -160% 0; } 100% { background-position: 260% 0; } }
      body > * { animation: rise 0.6s cubic-bezier(0.22,1,0.36,1) both; }
      body > *:nth-child(2) { animation-delay: 0.08s; }
      body > *:nth-child(3) { animation-delay: 0.16s; }
      body > *:nth-child(4) { animation-delay: 0.24s; }
      body > *:nth-child(5) { animation-delay: 0.32s; }
      body::after {
        content: "";
        position: fixed; left: 0; right: 0; bottom: 0; height: 3px;
        background: linear-gradient(90deg, transparent, #3b82f6, transparent);
        background-size: 200% 100%;
        animation: sheen 1.9s linear infinite;
      }
      .logo {
        width: 96px; height: 96px;
        border-radius: 26px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        display: flex; align-items: center; justify-content: center;
        font-size: 46px;
        box-shadow: 0 16px 48px rgba(37, 99, 235, 0.45);
        animation: pulse 2.2s ease-in-out infinite, floaty 4.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 16px 48px rgba(37, 99, 235, 0.45); }
        50% { box-shadow: 0 16px 64px rgba(37, 99, 235, 0.7); }
      }
      h1 { margin: 0; font-size: 34px; letter-spacing: 0.5px; background: linear-gradient(100deg,#e8eef6,#7cb0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .sub { color: #8ba3c4; font-size: 15px; margin-top: -14px; }
      .spinner {
        width: 44px; height: 44px;
        border: 4px solid rgba(148, 163, 184, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #msg { color: #b7c9e2; font-size: 15px; min-height: 22px; transition: color 0.3s ease; text-align: center; padding: 0 24px; }
      .warn { color: #fbbf24 !important; }
      .bad { color: #fca5a5 !important; }
      #detail {
        display: none; max-width: 640px; margin-top: -8px; padding: 12px 16px;
        border-radius: 12px; background: rgba(148,163,184,0.12); color: #9db2cd;
        font-size: 12.5px; line-height: 1.6; word-break: break-all; text-align: left;
      }
      #actions { display: none; gap: 10px; flex-wrap: wrap; justify-content: center; }
      button {
        font: inherit; font-size: 14px; padding: 10px 18px; border-radius: 999px;
        border: 1px solid rgba(148,163,184,0.4); background: rgba(255,255,255,0.06);
        color: #e8eef6; cursor: pointer;
      }
      button.primary { background: linear-gradient(135deg,#2563eb,#1d4ed8); border-color: transparent; }
      button:hover { filter: brightness(1.15); }
    </style>
  </head>
  <body>
    <div class="logo">🛡️</div>
    <h1>FaceGate</h1>
    <div class="sub">ระบบสแกนใบหน้าเข้า–ออกโรงเรียน</div>
    <div class="spinner" id="spinner"></div>
    <div id="msg">กำลังเปิดระบบ…</div>
    <div id="detail"></div>
    <div id="actions">
      <button class="primary" id="btnRetry">เปิดตัวประมวลผลใหม่</button>
      <button id="btnLog">ดูบันทึกปัญหา</button>
      <button id="btnSettings">หน้าตั้งค่า</button>
    </div>
    <script>
      let seconds = 0;
      let standalone = false;
      const msg = document.getElementById("msg");
      const detail = document.getElementById("detail");
      const actions = document.getElementById("actions");
      const spinner = document.getElementById("spinner");
      const api = window.electronAPI || {};

      function showTrouble(text, extra) {
        msg.textContent = text;
        msg.className = "bad";
        spinner.style.display = "none";
        actions.style.display = "flex";
        if (extra) {
          detail.textContent = extra;
          detail.style.display = "block";
        }
      }

      api.getConfig?.().then((cfg) => { standalone = Boolean(cfg && cfg.standalone); }).catch(() => {});

      // Ask the program itself what is happening instead of guessing — a stuck
      // loading screen almost always means the local engine did not start.
      async function poll() {
        seconds += 1;
        let s = null;
        try { s = await api.getAgentStatus?.(); } catch (e) {}
        if (s && s.state === "python_missing") {
          showTrouble(s.message || "ไม่พบโปรแกรม Python ในเครื่องนี้", s.lastError || "");
          return;
        }
        if (s && s.state === "configuration_required") {
          showTrouble("ยังไม่ได้ตั้งรหัสเครื่อง — กดปุ่ม “หน้าตั้งค่า” เพื่อกรอก", "");
          return;
        }
        if (s && s.state === "running") {
          msg.textContent = "พร้อมใช้งาน กำลังเปิดหน้าสแกน…";
          msg.className = "";
          return;
        }
        if (seconds === 10) {
          msg.textContent = standalone ? "กำลังเปิดตัวประมวลผลใบหน้าในเครื่อง…" : "กำลังรอการเชื่อมต่ออินเทอร์เน็ต…";
        } else if (seconds === 45) {
          const lines = [];
          if (s && s.message) lines.push("สถานะ: " + s.message);
          if (s && s.lastError) lines.push("รายละเอียด: " + s.lastError);
          if (s && s.python) lines.push("Python: " + s.python);
          if (s && s.logPath) lines.push("บันทึก: " + s.logPath);
          showTrouble(
            standalone
              ? "ตัวประมวลผลใบหน้ายังไม่เริ่มทำงาน จึงเปิดหน้าสแกนไม่ได้"
              : "ยังเชื่อมต่อไม่ได้ — ตรวจสอบสายแลน / Wi-Fi ของเครื่องตู้",
            lines.join("\n"),
          );
        }
      }
      setInterval(poll, 1000);
      poll();

      document.getElementById("btnRetry").onclick = async () => {
        seconds = 0;
        actions.style.display = "none";
        detail.style.display = "none";
        spinner.style.display = "block";
        msg.className = "";
        msg.textContent = "กำลังเปิดตัวประมวลผลใหม่…";
        try { await api.restartAgent?.(); } catch (e) {}
      };
      document.getElementById("btnLog").onclick = () => api.openAgentLog?.();
      document.getElementById("btnSettings").onclick = () => api.openSettings?.();

      window.addEventListener("offline", () => {
        if (standalone) return; // the local install does not need internet
        msg.textContent = "ไม่มีอินเทอร์เน็ต — รอการเชื่อมต่อ";
        msg.className = "warn";
      });
    </script>
  </body>
</html>
