<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaceGate — ตั้งค่าเครื่องตู้สแกน</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: "Sarabun", "Prompt", "Segoe UI", system-ui, sans-serif;
        margin: 0;
        background: radial-gradient(1200px 600px at 80% -10%, #1e3a5f 0%, #0f1e33 45%, #0a1424 100%);
        color: #e8eef6;
        display: flex;
        flex-direction: column;
        -webkit-user-select: none;
        user-select: none;
      }

      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes sheen { 0% { background-position: -160% 0; } 100% { background-position: 260% 0; } }
      .topbar, .card, .hint { animation: rise 0.55s cubic-bezier(0.22,1,0.36,1) both; }
      .card { animation-delay: 0.08s; }
      .hint { animation-delay: 0.16s; }
      body::before {
        content: "";
        position: fixed; top: 0; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, transparent, #3b82f6, transparent);
        background-size: 200% 100%;
        animation: sheen 2.2s linear infinite;
      }
      .topbar {
        padding: 22px 28px 0;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 44px; height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        display: flex; align-items: center; justify-content: center;
        font-size: 22px;
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), box-shadow 0.3s ease;
      }
      .logo:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 28px rgba(37, 99, 235, 0.55); }
      .brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.2px; }
      .brand span { font-size: 12.5px; color: #8ba3c4; }

      .card {
        margin: 22px 28px 0;
        padding: 22px 24px;
        background: rgba(17, 32, 54, 0.75);
        border: 1px solid rgba(96, 140, 200, 0.18);
        border-radius: 16px;
        backdrop-filter: blur(6px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
      }
      .card:hover { border-color: rgba(96, 140, 200, 0.35); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); }

      .field { margin-bottom: 16px; }
      label {
        display: flex; align-items: center; gap: 6px;
        margin-bottom: 7px; font-size: 13.5px; font-weight: 600; color: #b7c9e2;
      }
      .input-wrap { position: relative; }
      input {
        width: 100%;
        padding: 11px 42px 11px 14px;
        border: 1.5px solid #2a4161;
        border-radius: 10px;
        background: #0d1a2e;
        color: #f1f6fc;
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
      }
      .eye {
        position: absolute; right: 6px; top: 50%;
        transform: translateY(-50%);
        background: none; border: none; cursor: pointer;
        font-size: 15px; padding: 6px 8px; border-radius: 8px; color: #7e97b8;
      }
      .eye:hover { background: rgba(255,255,255,0.06); color: #cbd5e1; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
      }
      .error {
        color: #fca5a5;
        font-size: 13px;
        min-height: 20px;
        margin: -4px 0 8px;
      }

      .actions { display: flex; gap: 10px; }
      button {
        flex: 1;
        padding: 12px 16px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14.5px;
        font-weight: 700;
        font-family: inherit;
        transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
      }
      button:active { transform: scale(0.98); }
      .primary {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
        box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      }
      .primary:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(37, 99, 235, 0.55); }
      .ghost {
        background: rgba(148, 163, 184, 0.1);
        color: #c8d6ea;
        flex: 0 0 auto;
        padding-left: 22px; padding-right: 22px;
      }
      .ghost:hover { background: rgba(148, 163, 184, 0.18); transform: translateY(-1px); }

      .hint {
        margin: 18px 28px 0;
        padding: 14px 16px;
        background: rgba(59, 130, 246, 0.08);
        border: 1px solid rgba(59, 130, 246, 0.2);
        border-radius: 12px;
        font-size: 12.5px;
        color: #93aecf;
        line-height: 1.65;
      }
      .hint b { color: #bcd3f2; }
      .hint code {
        background: rgba(255,255,255,0.08);
        padding: 1px 6px;
        border-radius: 5px;
        font-size: 11.5px;
      }

      .statusbar {
        margin-top: auto;
        padding: 14px 28px 18px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: #7e97b8;
      }
      .dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: #f59e0b;
        box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      }
      .dot.ok { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }
      .dot.bad { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="logo">🛡️</div>
      <div class="brand">
        <h1>FaceGate</h1>
        <span>ตั้งค่าเครื่องตู้สแกนใบหน้า</span>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label for="deviceKey">🔑 รหัสเครื่อง (Device Key)</label>
        <div class="input-wrap">
          <input id="deviceKey" type="password" placeholder="วางรหัสเครื่องที่นี่" autocomplete="off" />
          <button class="eye" id="toggleKey" type="button" title="แสดง/ซ่อนรหัส">👁</button>
        </div>
      </div>

      <div class="field">
        <label for="cloudUrl">🌐 ที่อยู่ระบบหลังบ้าน</label>
        <input id="cloudUrl" type="url" placeholder="https://...lovable.app" style="padding-right: 14px" />
      </div>

      <div class="error" id="error"></div>

      <div class="actions">
        <button class="primary" id="saveBtn">บันทึกและเริ่มสแกน</button>
        <button class="ghost" id="quitBtn">ปิดโปรแกรม</button>
      </div>
    </div>

    <div class="hint">
      <b>หารหัสเครื่องได้จาก:</b> เปิดระบบหลังบ้าน → เมนู <b>ตั้งค่าระบบ</b> → หัวข้อ <b>เครื่องตู้สแกน</b> →
      กด "สร้างรหัสเครื่อง" แล้วคัดลอกมาวางที่นี่
    </div>

    <div class="statusbar">
      <span class="dot" id="dot"></span>
      <span id="statusText">กำลังตรวจสอบการเชื่อมต่อ…</span>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      async function init() {
        const cfg = await window.electronAPI.getConfig();
        $("deviceKey").value = cfg.deviceKey || "";
        $("cloudUrl").value = cfg.cloudUrl || "";
        checkConnection();
      }

      async function checkConnection() {
        const dot = $("dot"), text = $("statusText");
        dot.className = "dot";
        text.textContent = "กำลังตรวจสอบการเชื่อมต่อ…";
        const url = ($("cloudUrl").value || "").trim().replace(/\/$/, "");
        if (!url) {
          dot.className = "dot bad";
          text.textContent = "ยังไม่ได้ระบุที่อยู่ระบบหลังบ้าน";
          return;
        }
        try {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 6000);
          const res = await fetch(url + "/api/public/agent/manifest.json", {
            signal: ctrl.signal, cache: "no-store",
          });
          clearTimeout(timer);
          if (res.ok) {
            dot.className = "dot ok";
            text.textContent = "เชื่อมต่อระบบหลังบ้านสำเร็จ";
          } else {
            dot.className = "dot bad";
            text.textContent = "เชื่อมต่อได้แต่ระบบตอบกลับผิดปกติ (" + res.status + ")";
          }
        } catch {
          dot.className = "dot bad";
          text.textContent = "เชื่อมต่อไม่ได้ — ตรวจสอบอินเทอร์เน็ตและที่อยู่ระบบ";
        }
      }

      $("toggleKey").addEventListener("click", () => {
        const input = $("deviceKey");
        input.type = input.type === "password" ? "text" : "password";
      });

      let debounce = null;
      $("cloudUrl").addEventListener("input", () => {
        clearTimeout(debounce);
        debounce = setTimeout(checkConnection, 800);
      });

      $("saveBtn").addEventListener("click", async () => {
        const deviceKey = $("deviceKey").value.trim();
        const cloudUrl = $("cloudUrl").value.trim().replace(/\/+$/, "");
        if (!deviceKey) {
          $("error").textContent = "กรุณาใส่รหัสเครื่องก่อน";
          return;
        }
        try {
          const parsed = new URL(cloudUrl);
          if (parsed.protocol !== "https:" && parsed.protocol !== "http:") throw new Error();
        } catch {
          $("error").textContent = "ที่อยู่ระบบไม่ถูกต้อง กรุณาใส่ URL ที่ขึ้นต้นด้วย https://";
          return;
        }
        $("error").textContent = "";
        $("saveBtn").textContent = "กำลังเริ่ม…";
        try {
          await window.electronAPI.saveConfig({ deviceKey, cloudUrl });
        } catch (error) {
          $("error").textContent = error?.message || "บันทึกไม่สำเร็จ กรุณาตรวจสอบข้อมูล";
          $("saveBtn").textContent = "บันทึกและเริ่มสแกน";
        }
      });

      $("quitBtn").addEventListener("click", () => window.electronAPI.quit());

      init();
    </script>
  </body>
</html>
