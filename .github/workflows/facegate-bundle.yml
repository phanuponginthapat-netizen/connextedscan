name: FaceGate all-in-one bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "หมายเลขเวอร์ชัน (จะใช้เป็นชื่อ Release เช่น 1.4.0)"
        required: false
        default: "1.4.1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build offline bundle
        shell: pwsh
        env:
          CI: "false"
        run: powershell -ExecutionPolicy Bypass -File bundle/build-windows-bundle.ps1
      - name: Show output
        if: always()
        shell: pwsh
        run: Get-ChildItem bundle/dist -ErrorAction SilentlyContinue | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: FaceGate-AllInOne-windows-x64
          path: bundle/dist/FaceGate-AllInOne-windows-x64.zip
          retention-days: 14
      - name: Build standalone (offline, no central server)
        shell: pwsh
        env:
          CI: "false"
        run: powershell -ExecutionPolicy Bypass -File bundle/build-windows-bundle.ps1 -Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: FaceGate-Standalone-windows-x64
          path: bundle/dist/FaceGate-Standalone-windows-x64.zip
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Build offline bundle
        env:
          CI: "false"
        run: bash bundle/build-linux-bundle.sh
      - name: Show output
        if: always()
        run: ls -lh bundle/dist || true; df -h /
      - uses: actions/upload-artifact@v4
        with:
          name: FaceGate-AllInOne-linux-x64
          path: bundle/dist/FaceGate-AllInOne-linux-x64.tar.gz
          retention-days: 14
      - name: Build standalone (offline, no central server)
        env:
          CI: "false"
          STANDALONE: "1"
        run: bash bundle/build-linux-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FaceGate-Standalone-linux-x64
          path: bundle/dist/FaceGate-Standalone-linux-x64.tar.gz
          retention-days: 14

  release:
    needs: [windows, linux]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Collect files
        id: collect
        run: |
          mkdir -p release
          find downloaded -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release/ \;
          ls -lh release
          test -n "$(ls -A release)" || { echo "no bundle files were built"; exit 1; }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: facegate-v${{ inputs.version }}
          name: FaceGate ${{ inputs.version }}
          body: |
            ไฟล์ติดตั้ง FaceGate แบบครบชุด (ไม่ต้องโหลดอะไรเพิ่มหลังติดตั้ง)

            - Windows: `FaceGate-AllInOne-windows-x64.zip` → แตกไฟล์ → ดับเบิลคลิก `ติดตั้ง-FaceGate.bat`
            - Linux: `FaceGate-AllInOne-linux-x64.tar.gz` → แตกไฟล์ → `bash install.sh`

            รุ่นจบในเครื่อง (Standalone — ไม่ต้องต่ออินเทอร์เน็ต ไม่ต้องพึ่งระบบกลาง):

            - Windows: `FaceGate-Standalone-windows-x64.zip`
            - Linux: `FaceGate-Standalone-linux-x64.tar.gz`

            ลิงก์ดาวน์โหลดล่าสุดแบบถาวร:
            `https://github.com/${{ github.repository }}/releases/latest/download/FaceGate-AllInOne-windows-x64.zip`
            `https://github.com/${{ github.repository }}/releases/latest/download/FaceGate-AllInOne-linux-x64.tar.gz`
            `https://github.com/${{ github.repository }}/releases/latest/download/FaceGate-Standalone-windows-x64.zip`
            `https://github.com/${{ github.repository }}/releases/latest/download/FaceGate-Standalone-linux-x64.tar.gz`
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
