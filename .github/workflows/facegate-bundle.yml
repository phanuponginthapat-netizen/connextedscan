name: FaceGate all-in-one bundle

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build offline bundle
        shell: pwsh
        env:
          CI: "false"
        run: powershell -ExecutionPolicy Bypass -File bundle/build-windows-bundle.ps1
      - name: Show output
        if: always()
        shell: pwsh
        run: Get-ChildItem bundle/dist -ErrorAction SilentlyContinue | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: FaceGate-AllInOne-windows-x64
          path: bundle/dist/FaceGate-AllInOne-windows-x64.zip
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Build offline bundle
        env:
          CI: "false"
        run: bash bundle/build-linux-bundle.sh
      - name: Show output
        if: always()
        run: ls -lh bundle/dist || true; df -h /
      - uses: actions/upload-artifact@v4
        with:
          name: FaceGate-AllInOne-linux-x64
          path: bundle/dist/FaceGate-AllInOne-linux-x64.tar.gz
          retention-days: 14
