<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FaceGate Scanner</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #06142c;
        color: #e6f0ff;
        font-family: system-ui, -apple-system, "Noto Sans Thai", sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .dot {
        width: 12px;
        height: 12px;
        margin: 18px auto 0;
        border-radius: 50%;
        background: #38d39f;
        animation: pulse 1.1s infinite ease-in-out;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.8);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.3);
          opacity: 1;
        }
      }
      a {
        color: #7cc4ff;
      }
    </style>
  </head>
  <body>
    <div>
      <h1 style="margin: 0; font-size: 22px">FaceGate Scanner</h1>
      <p style="opacity: 0.7; font-size: 14px">กำลังเปิดหน้าจอสแกนใบหน้า…</p>
      <div class="dot"></div>
      <p style="opacity: 0.6; font-size: 12px; margin-top: 24px">
        ถ้าค้างอยู่หน้านี้ ให้ตรวจการเชื่อมต่ออินเทอร์เน็ต แล้วเปิดแอปใหม่
      </p>
    </div>
  </body>
</html>
